<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="taskInput">

    <button id="addBtn">
        Add Task
    </button>

    <ul id="taskList"></ul>
</body>

<script>
    const task = []
    const taskinput = document.getElementById('taskInput')
    const tasklist = document.getElementById('taskList')
    const addbutton = document.getElementById('addBtn')


// Function to handle rendering the UI
    function renderTasks() {
        tasklist.innerHTML = ""; // Clear the list

        task.forEach((task, index) => {
            // Create the list item
            const li = document.createElement('li');
            li.textContent = task + " ";

            // Create the delete button
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = "Delete";
            
            // Attach delete functionality using the index
            deleteBtn.addEventListener('click', () => {
                task.splice(index, 1); // Remove from array
                renderTasks();          // Re-render the list
            });

            // Append elements
            li.appendChild(deleteBtn);
            tasklist.appendChild(li);
        });
    }

    // Add task event listener
    addbutton.addEventListener('click', () => {
        const taskValue = taskinput.value.trim();

        if (taskValue !== "") { // Prevent adding empty tasks
            task.push(taskValue);
            taskinput.value = ""; // Clear the input field after adding
            renderTasks();
        }
    });
    

</script>
</html>>
